# =============================================================================
# CI pipeline for the dq_dashboard bundle.
# Trigger: push to feature/* -> validate only; push to main -> validate + test + prod.
#
# Required pipeline variables (set in Azure DevOps, not in YAML; mark secrets as secret):
#   DATABRICKS_HOST_TEST, DATABRICKS_HOST_PROD                     - workspace URLs
#   DATABRICKS_CLIENT_ID_TEST, DATABRICKS_CLIENT_ID_PROD           - service principal application ID
#   DATABRICKS_CLIENT_SECRET_TEST, DATABRICKS_CLIENT_SECRET_PROD   - service principal OAuth secret
#   DQ_NOTIFICATION_EMAIL                                          - team address for alerts
# =============================================================================
trigger:
  branches:
    include:
      - main
      - feature/*

variables:
  BUNDLE_ROOT: bundles/dq_dashboard
  CLI_VERSION: v0.281.0   # keep in line with databricks_cli_version in databricks.yml

pool:
  vmImage: ubuntu-latest

stages:
  # ------------------------------------------------------------------ #
  # Stage 1: validate (all branches)                                     #
  # ------------------------------------------------------------------ #
  - stage: validate
    displayName: Validate bundle
    jobs:
      - job: validate
        steps:
          - checkout: self
          - script: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/$(CLI_VERSION)/install.sh | sudo sh
            displayName: Install Databricks CLI
          - script: |
              DATABRICKS_HOST=$(DATABRICKS_HOST_TEST) \
              DATABRICKS_CLIENT_ID=$(DATABRICKS_CLIENT_ID_TEST) \
              DATABRICKS_CLIENT_SECRET=$(DATABRICKS_CLIENT_SECRET_TEST) \
              VALIDATE_ONLY=1 \
              bash $(BUNDLE_ROOT)/scripts/deploy.sh test
            displayName: Validate target=test

  # ------------------------------------------------------------------ #
  # Stage 2: deploy to test (main only)                                  #
  # ------------------------------------------------------------------ #
  - stage: deploy_test
    displayName: Deploy to test
    dependsOn: validate
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: deploy_test
        steps:
          - checkout: self
          - script: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/$(CLI_VERSION)/install.sh | sudo sh
            displayName: Install Databricks CLI
          - script: |
              DATABRICKS_HOST=$(DATABRICKS_HOST_TEST) \
              DATABRICKS_CLIENT_ID=$(DATABRICKS_CLIENT_ID_TEST) \
              DATABRICKS_CLIENT_SECRET=$(DATABRICKS_CLIENT_SECRET_TEST) \
              BUNDLE_VAR_notification_email=$(DQ_NOTIFICATION_EMAIL) \
              bash $(BUNDLE_ROOT)/scripts/deploy.sh test
            displayName: Deploy and run dq_setup on test

  # ------------------------------------------------------------------ #
  # Stage 3: deploy to prod (main only, after test)                      #
  # ------------------------------------------------------------------ #
  - stage: deploy_prod
    displayName: Deploy to prod
    dependsOn: deploy_test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: deploy_prod
        environment: production
        strategy:
          runOnce:
            deploy:
              steps:
                # Deployment jobs do not check out the repository by themselves.
                - checkout: self
                - script: curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/$(CLI_VERSION)/install.sh | sudo sh
                  displayName: Install Databricks CLI
                - script: |
                    DATABRICKS_HOST=$(DATABRICKS_HOST_PROD) \
                    DATABRICKS_CLIENT_ID=$(DATABRICKS_CLIENT_ID_PROD) \
                    DATABRICKS_CLIENT_SECRET=$(DATABRICKS_CLIENT_SECRET_PROD) \
                    BUNDLE_VAR_notification_email=$(DQ_NOTIFICATION_EMAIL) \
                    bash $(BUNDLE_ROOT)/scripts/deploy.sh prod
                  displayName: Deploy and run dq_setup on prod
