# =============================================================================
# PROD - separate production workspace. Deployed only by CI as the service
# principal, from the main branch.
#
# TODO before first deploy (see README.md, section 7 "Setting up test and prod"):
#   1. workspace.host           -> URL of the production workspace
#   2. service_principal        -> application ID of the deploy/run service principal
#   3. warehouse_id lookup      -> name of the SQL warehouse in that workspace
#   4. notification_email       -> team address
#   5. account groups -> owner_group / uc_viewer_group must be account groups
# All values can also be given at deploy time:  BUNDLE_VAR_<name>=<value>
# =============================================================================
targets:
  prod:
    mode: production
    workspace:
      # Host is not a variable (the CLI needs it before variables are resolved).
      # Set it here, or leave it commented and pass DATABRICKS_HOST from CI.
      # host: https://<PROD_WORKSPACE_HOST>
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.service_principal}
    presets:
      tags:
        env: prod
    permissions:
      - group_name: ${var.owner_group}
        level: CAN_MANAGE
    variables:
      catalog: analytics_dq_prod
      schema: reporting
      warehouse_id:
        lookup:
          warehouse: "<PROD_SQL_WAREHOUSE_NAME>"
      deploy_base_views: "true"
      create_base_tables: "true"
      schedule_status: UNPAUSED
      service_principal: "<SERVICE_PRINCIPAL_APPLICATION_ID>"
      notification_email: "<DQ_TEAM_EMAIL>"
