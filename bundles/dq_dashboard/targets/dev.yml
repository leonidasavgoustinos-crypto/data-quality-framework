# =============================================================================
# DEV - development workspace. Each developer deploys an own, prefixed copy of
# the dashboard and jobs ("[dev <user>] ...") under their home folder and an
# own reporting schema reporting_<user>; schedules are paused.
# =============================================================================
targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://adb-1451829595406012.12.azuredatabricks.net
    presets:
      tags:
        env: dev
    variables:
      catalog: analytics_dq_dev
      # One reporting schema per developer: each dev deploy builds its own views.
      schema: reporting_${workspace.current_user.short_name}
      warehouse_id:
        lookup:
          warehouse: brickbybrickWH
      deploy_base_views: "true"
      create_base_tables: "true"
      # Failure emails go to the developer who deployed.
      notification_email: ${workspace.current_user.userName}
      schedule_status: PAUSED
