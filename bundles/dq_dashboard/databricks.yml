# =============================================================================
# Data quality dashboard - Declarative Automation Bundle
#
# One bundle = one deployable unit (dashboard + the jobs that build everything
# it needs). Every environment (dev / test / prod) lives in its OWN workspace.
#
#   databricks.yml        -> bundle name, includes, variable declarations
#   targets/<env>.yml     -> one file per environment (values only)
#   resources/**.yml      -> one file per resource (dashboard, jobs)
#   src/                  -> dashboard JSON, SQL files, generic runner notebooks
#
# Deploy:  ./scripts/deploy.sh <target>   (render -> validate -> deploy -> run dq_setup)
# =============================================================================

bundle:
  name: dq_dashboard
  # Pins the CLI version used by every developer / CI runner.
  databricks_cli_version: ">= 0.281.0"

include:
  - targets/*.yml
  - resources/**/*.yml

# Only the bundle's own folder is uploaded to the workspace.
sync:
  exclude:
    - scripts/**
    - ci/**
    - build/**

# -----------------------------------------------------------------------------
# Variables. Every environment-specific or business value is declared here with
# a description and a safe default. Override them in targets/<env>.yml, with
# --var name=value, or with the environment variable BUNDLE_VAR_<name>.
# -----------------------------------------------------------------------------
variables:
  # ---- Where the dashboard objects are created --------------------------------
  catalog:
    description: Catalog that holds the reporting schema (views read by the dashboard).
    default: analytics_dq_dev
  schema:
    description: Schema for the dashboard views (v_simple_*). Created if missing.
    default: reporting

  # ---- Where the DQ framework base tables live --------------------------------
  source_catalog:
    description: Catalog of the DQ framework base tables (results / configuration / metadata).
    default: ${var.catalog}
  results_schema:
    description: Schema of the framework result tables (result, result_table, result_rule).
    default: results
  configuration_schema:
    description: Schema of the framework configuration tables (rule_assignment, rule_template, run_policy, apply_at).
    default: configuration
  metadata_schema:
    description: Schema of the framework metadata tables (table, project, rule_dimension, rule_type).
    default: metadata
  quarantine_schema:
    description: Schema the framework writes quarantined rows to.
    default: quarantine

  # ---- Compute ------------------------------------------------------------------
  warehouse_id:
    description: SQL warehouse used by the dashboard. Set per target with a lookup by warehouse name.

  # ---- Feature switches ("true" / "false") -------------------------------------
  create_catalog:
    description: Create the catalogs if they do not exist (needs CREATE CATALOG on the metastore).
    default: "false"
  create_schemas:
    description: Create the reporting and framework schemas if they do not exist.
    default: "true"
  create_base_tables:
    description: Create the framework base tables if they do not exist (never replaces existing tables).
    default: "true"
  deploy_base_views:
    description: (Re)create the base dashboard views (v_simple_status ... v_simple_coverage). Set "false" only if someone maintains the views of this reporting schema by hand.
    default: "true"
  deploy_ext_views:
    description: (Re)create the extension views (v_simple_*_ext).
    default: "true"
  run_smoke_tests:
    description: Run the structural smoke tests at the end of dq_setup.
    default: "true"

  # ---- Access -------------------------------------------------------------------
  owner_group:
    description: Group that manages the bundle resources and owns the data objects (CAN_MANAGE / ALL PRIVILEGES on the schema). Must be an account group.
    default: dq-framework-admins
  viewer_group:
    description: Workspace group that can open the dashboard (CAN_RUN) and see the jobs (CAN_VIEW). Workspace permissions only.
    default: users
  uc_viewer_group:
    description: Account-level group that gets USE CATALOG, USE SCHEMA and SELECT on the reporting schema. Must be an account group (workspace-local groups like "users" cannot receive Unity Catalog grants).
    default: account users
  service_principal:
    description: Application ID of the service principal that runs jobs in test / prod.
    default: "<SERVICE_PRINCIPAL_APPLICATION_ID>"
  notification_email:
    description: Address (person or distribution list) that receives job failure emails.
    default: "<DQ_TEAM_EMAIL>"

  # ---- Dashboard ----------------------------------------------------------------
  dashboard_display_name:
    description: Name of the dashboard in the workspace.
    default: Data quality

  # ---- Schedules ----------------------------------------------------------------
  timezone:
    description: Timezone for job schedules.
    default: Europe/Athens
  setup_cron:
    description: Quartz cron for the (re)build of all objects by dq_setup.
    default: "0 0 5 ? * MON"
  healthcheck_cron:
    description: Quartz cron for the daily health check.
    default: "0 0 7 * * ?"
  schedule_status:
    description: PAUSED or UNPAUSED for all schedules of this target.
    default: PAUSED
  freshness_max_days:
    description: Health check fails when the newest DQ run is older than this many days.
    default: "3"

  # ---- Business parameters used inside the views --------------------------------
  # Defaults are the values agreed with the view owner. Changing them changes numbers on the dashboard.
  weight_high:
    description: Score weight of a rule with criticality High.
    default: "3"
  weight_medium:
    description: Score weight of a rule with criticality Medium.
    default: "2"
  weight_low:
    description: Score weight of a rule with criticality Low.
    default: "1"
  weight_default:
    description: Score weight when the criticality is unknown.
    default: "2"
  score_k_shrink:
    description: Quality score shrinkage strength towards the pooled mean.
    default: "3"
  score_stale_factor:
    description: A table is stale when its last run is older than stale_factor x its usual interval.
    default: "2"
  score_interval_window_days:
    description: Days used to measure a table's usual run interval.
    default: "60"
  score_min_days_for_interval:
    description: Minimum run days before staleness is evaluated.
    default: "3"
  score_warning_penalty:
    description: Share of a Warning's failed rows that counts against the score (0-1).
    default: "0.5"

# Shared defaults for every target. Targets add their own values on top.
presets:
  tags:
    project: data_quality
    bundle: dq_dashboard
